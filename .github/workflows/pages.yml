# 用仓库 Gemfile 里的 Jekyll 版本构建并部署到 GitHub Pages。
# 不用 GitHub Pages 的经典构建（它固定在 Jekyll 3.10.x），避免线上与本地版本不一致。
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；进行中的不取消，避免部署到一半被打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Check build output
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/ads.txt
          test -f _site/robots.txt
          pages=$(find _site -name index.html | wc -l)
          echo "built $pages pages"
          test "$pages" -ge 40

      # 联盟链接必须带 rel="sponsored nofollow"，漏标是 Google 链接政策的风险点。
      # 清单来自 _data/affiliates.yml，加了新联盟却忘了什么的话这里会直接失败。
      # frontmatter 里的 YAML 出错时 Jekyll 会静默丢掉整块（faq、toc 都会消失），
      # 页面照常构建、看不出问题。最常见的原因是双引号标量里又写了 ASCII 双引号。
      - name: Check front matter parses
        run: |
          ruby -ryaml -rdate -e '
            bad = []
            missing = []
            Dir.glob("_chapters/**/*.md").push("index.md").each do |f|
              text = File.read(f)
              next unless text.start_with?("---")
              fm = text.split("---", 3)[1]
              begin
                data = YAML.safe_load(fm, permitted_classes: [Date, Time])
              rescue => e
                bad << "#{f}: #{e.message.lines.first.strip}"
                next
              end
              %w[title description nav].each do |key|
                missing << "#{f}: 缺 #{key}" unless data && data[key]
              end
            end
            abort("front matter 解析失败:\n" + bad.join("\n")) unless bad.empty?
            abort("front matter 字段缺失:\n" + missing.join("\n")) unless missing.empty?
            puts "front matter OK"
          '

      - name: Check affiliate links are marked sponsored
        run: |
          ruby -ryaml -e '
            matches = (YAML.load_file("_data/affiliates.yml")["domains"] || [])
                        .map { |d| d["match"] }.compact
            bad = []
            total = 0
            Dir.glob("_site/**/*.html").each do |f|
              File.read(f).scan(/<a\s([^>]*)>/) do |attrs,|
                href = attrs[/href="([^"]*)"/, 1]
                next unless href && matches.any? { |m| href.include?(m) }
                total += 1
                rel = (attrs[/rel="([^"]*)"/, 1] || "").split
                bad << "#{f}: #{href}" unless (%w[sponsored nofollow] - rel).empty?
              end
            end
            puts "checked #{total} affiliate links"
            abort("missing rel=\"sponsored nofollow\":\n" + bad.join("\n")) unless bad.empty?
            abort("no affiliate links found - plugin broken?") if total.zero?
          '

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
