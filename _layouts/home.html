---
layout: default
---
<div class="home">
  <header class="hero">
    <picture>
      <source srcset="{{ '/assets/images/cover.webp' | relative_url }}" type="image/webp">
      <img class="hero-cover" src="{{ '/assets/images/cover.png' | relative_url }}"
           width="480" height="676" fetchpriority="high" decoding="async"
           alt="英国生存指南封面">
    </picture>
    <div class="hero-text">
      <h1 class="home-title">{{ page.title }}</h1>
      <p class="home-subtitle">{{ site.description }}</p>
      <div class="hero-rule"></div>
    </div>
  </header>
  <div class="home-body">
    {{ content }}
  </div>
</div>
