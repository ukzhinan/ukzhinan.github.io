<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="英国生存指南">
  <!-- Union Jack，按官方构造法（含 St Patrick 十字的 counterchange）适配为正方形 -->
  <clipPath id="cc">
    <path d="M32,32 h32 v32 z v32 h-32 z h-32 v-32 z v-32 h32 z"/>
  </clipPath>
  <rect width="64" height="64" fill="#012169"/>
  <path d="M0,0 L64,64 M64,0 L0,64" stroke="#ffffff" stroke-width="13"/>
  <path d="M0,0 L64,64 M64,0 L0,64" clip-path="url(#cc)" stroke="#C8102E" stroke-width="8"/>
  <path d="M32,0 V64 M0,32 H64" stroke="#ffffff" stroke-width="21"/>
  <path d="M32,0 V64 M0,32 H64" stroke="#C8102E" stroke-width="13"/>
</svg>
