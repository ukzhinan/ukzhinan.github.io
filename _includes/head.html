<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign seo_title = page.title | default: site.title %}
{% if page.url != '/' %}
  {% assign seo_title = seo_title | append: ' · ' | append: site.title %}
{% endif %}
{% assign seo_desc = page.description | default: site.description %}
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_desc }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/uk_survive_book_cover.png' | absolute_url }}">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_desc }}">
<meta name="twitter:image" content="{{ '/assets/images/uk_survive_book_cover.png' | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
